<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codeyard Studio Support</title>
  <meta name="description" content="Get help and support for any Codeyard Studio app, including Monely and Trainix." />
  <link rel="icon" type="image/png" href="./assets/codeyard-studio-logo.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f5f7fa;
      padding: 40px 16px;
      text-align: center;
      color: #333;
    }
    .card {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .logo { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 16px; }
    h1 { color: #6c63ff; margin-bottom: 8px; }
    .subtitle { color: #6b7280; font-size: 15px; margin-bottom: 28px; }
    .app-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; text-align: left; }
    .app-link {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; border-radius: 10px; border: 1px solid #e5e7eb;
      text-decoration: none; color: #111827; font-weight: 600; font-size: 15px;
      transition: border-color .2s, color .2s;
    }
    .app-link:hover { border-color: #6c63ff; color: #6c63ff; }
    a { color: #6c63ff; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    hr { border: none; border-top: 1px solid #e5e7eb; margin: 28px 0; }
    p { line-height: 1.6; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="./assets/codeyard-studio-logo.png" alt="Codeyard Studio" />
    <h1>Codeyard Studio Support</h1>
    <p class="subtitle">Need help with one of our apps? Pick your app below or contact us directly.</p>

    <div class="app-list">
      <a class="app-link" href="./monely-money-manager/support.html">Monely – Money Manager</a>
      <a class="app-link" href="./trainix/faq.html">Trainix – Workout Tracker</a>
    </div>

    <p><strong>Email:</strong><br />
    <a href="mailto:codeyard.studio@gmail.com">codeyard.studio@gmail.com</a></p>

    <p>We usually reply within 24–48 hours.</p>

    <hr />

    <p style="font-size:14px;color:#777;">
      Codeyard Studio © 2026
    </p>
  </div>
</body>
</html>
